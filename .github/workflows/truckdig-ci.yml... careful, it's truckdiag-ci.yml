name: truckdiag CI

on:
  push:
    paths:
      - 'truckdiag/**'
      - '.github/workflows/truckdiag-ci.yml'
  pull_request:
    paths:
      - 'truckdiag/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truckdiag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run test suite
        run: |
          python tests/test_decoder.py
          python tests/test_transport.py
          python tests/test_thresholds.py
          python tests/test_e2e.py
